# circus repo catalog
#
# Each entry is a repo the handler knows about. The handler reads this
# before any repo-touching operation. See CLAUDE.md for what each field
# means and how categories drive workflow.

repos:
  # ----------------------------------------------------------------------
  # The testbed: small Node project with intentional bugs/gaps. First
  # mission target. Owned.
  - name: testbed
    category: owned
    path: /Users/geoffpotter/code/circus-testbed
    worktree_root: /Users/geoffpotter/code/circus-testbed-worktrees
    default_branch: main
    identity:
      name: Geoff Potter
      email: geoffpot@gmail.com

