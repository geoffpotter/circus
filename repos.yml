# circus repo catalog
#
# Each entry is a repo the handler knows about. The handler reads this
# before any repo-touching operation. See CLAUDE.md for what each field
# means and how categories drive workflow.
#
# Defaults (set per-entry to override):
#   path:           $CIRCUS_ROOT/repos/<name>
#   worktree_root:  $CIRCUS_ROOT/worktrees  (shared)
#   default_branch: main
#   issues_mode:    local                   (don't create GH issues)
#   wiki:           false                   (don't sync wiki knowledge base)
#   status_wiki:    off                     (don't push status page to wiki)
#   nwo:            inferred from origin remote
#
# wiki vs. status_wiki:
#   - wiki: true       — bin/wiki-sync.sh pulls+pushes the whole wiki
#                        (knowledge base: patterns, gotchas, history)
#   - status_wiki: on  — bin/status-sync.sh pushes ONLY
#                        meta/repo-status/<name>.md → wikis/<name>/Status.md.
#                        Local-first; the source of truth lives in circus.
#                        The two flags are independent.
#
# Registration is normally done via bin/add-repo.sh <url>, not by hand.
# `repos:` is kept LAST in this file so add-repo.sh can append safely.
#
# Schema reference --------------------------------------------------------
#
#   # Contributor repo using the fork pattern:
#   - name: someones-open-source-lib
#     category: contributor
#     nwo: original-org/original-repo
#     default_branch: main
#     issues_mode: local
#     wiki: false
#     upstream_pr: from_fork
#     upstream_remote_url: https://github.com/original-org/original-repo.git
#     identity:
#       name: Geoff Potter
#       email: geoffpot@gmail.com
#
#   # Contributor repo with branch-push access to upstream:
#   - name: work-monorepo
#     category: contributor
#     nwo: our-org/work-monorepo
#     default_branch: main
#     upstream_pr: branch_on_upstream
#     upstream_remote_url: git@github.com:our-org/work-monorepo.git
#     identity:
#       name: Geoff Potter
#       email: geoffpot@work-domain.com
#
#   # Reference repo (read-only, ferrets only):
#   - name: screeps-engine
#     category: reference

contexts:
  # Free-form groupings used by meta/contexts/<name>.md. The handler reads
  # the matching context md when a mission targets a repo in the context.
  - name: personal
    repos: [circus-testbed]

repos:
  - name: circus-testbed
    category: owned
    nwo: geoffpotter/circus-testbed
    default_branch: main
    issues_mode: mirror
    wiki: false
    identity:
      name: Geoff Potter
      email: geoffpot@gmail.com
